<!-- القوالب تم الإستعانه فيها بالذكاء الأصطناعي لإنشاءه نظرًآ لعدم وصولنا لها بعد -->
<style> 
/* 1. إعدادات عامة وتنسيق أطراف الصفحة */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6; /* لون خلفية هادئ */
    margin: 0;
    padding: 40px; /* مسافة من أطراف المتصفح */
    line-height: 1.6;
    color: #333;
}

/* 2. تنسيق العناوين (H1, H2, H3) */
h1 {
    color: #2c3e50;
    text-align: center;
    border-bottom: 3px solid #3498db;
    padding-bottom: 10px;
    margin-bottom: 30px;
}

h2 {
    color: #2980b9;
    border-right: 5px solid #3498db;
    padding-right: 15px;
    margin-top: 40px;
}

h3 {
    color: #34495e;
    line-height: 1.8; /* لضمان عدم تداخل الأسطر المشكلة */
    margin-bottom: 20px;
}

/* 3. تنسيق الجداول (Table) */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* ظل خفيف للجداول */
    border-radius: 10px;
    overflow: hidden;
    margin: 20px 0;
}

th, td {
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

th {
    background-color: #3498db;
    color: white;
    font-weight: bold;
}

tr:hover {
    background-color: #f1f9ff; /* تأثير عند مرور الماوس على الصف */
}

/* 4. تنسيق الصور (Images) */
img {
    max-width: 100%;
    height: auto;
    border-radius: 15px; /* حواف دائرية جمالية */
    box-shadow: 0 10px 20px rgba(0,0,0,0.15); /* ظل يعطي عمق للصورة */
    transition: transform 0.3s ease; /* حركة ناعمة عند اللمس */
}

img:hover {
    transform: scale(1.02); /* تكبير بسيط عند مرور الماوس */
}

/* 5. تنسيق الـ iframe */
iframe {
    border: none;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    background: white;
}

/* 6. تنسيق الروابط (Links) */
a {
    color: #3498db;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

a:hover {
    color: #1d6fa5;
    text-decoration: underline;
}

/* 7. لمسة جمالية للقوائم المرقمة (OL) */
ol {
    background: #ffffff;
    padding: 30px 50px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

li {
    border-bottom: 1px dashed #ddd;
    padding: 10px 0;
}

li:last-child {
    border-bottom: none;
}</style>
